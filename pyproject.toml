[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobileclaw-daily"
version = "1.0.1"
description = "MobileClaw daily token welfare claimer with server-side readback"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "L0NE-6" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]

[project.scripts]
mobileclaw-daily = "mobileclaw_daily:main"

[tool.setuptools]
py-modules = ["mobileclaw_daily"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
